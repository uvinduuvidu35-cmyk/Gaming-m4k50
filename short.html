<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming m4k Store - Account Details</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f7fa; color: #333; }

    /* Header & Navigation System */
    .header { 
      height: 62px; 
      background: #fff; 
      border-bottom: 1px solid #e1e8ed; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 5%; 
      position: sticky; 
      top: 0; 
      z-index: 1000; 
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 9px; 
      font-size: 16px; 
      font-weight: 800; 
      color: #0d47a1; 
      letter-spacing: 0.5px; 
      text-decoration: none; 
    }
    .logo-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #64b5f6; }

    .menu-toggle { 
      display: block; 
      font-size: 22px; 
      color: #0d47a1; 
      cursor: pointer; 
    }

    .nav-wrapper { 
      display: none; 
      flex-direction: column; 
      position: absolute; 
      top: 62px; 
      left: 0; 
      width: 100%; 
      background: #ffffff; 
      border-bottom: 1px solid #e1e8ed; 
      padding: 15px 5%; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
      gap: 15px;
      z-index: 999;
    }

    .nav-wrapper.active { display: flex; }

    .nav { display: flex; flex-direction: column; width: 100%; gap: 8px; }

    .nav a { 
      text-decoration: none; 
      color: #555; 
      font-size: 14px; 
      padding: 10px; 
      border-radius: 7px; 
      font-weight: 600; 
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav a:hover, .nav a.active { background: #e3f2fd; color: #0d47a1; }

    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px 0;
      border-top: 1px solid #eee;
    }

    .social-icon { font-size: 20px; color: #0d47a1; text-decoration: none; transition: color 0.2s ease; }
    .social-icon:hover { color: #00b0ff; }

    .auth-buttons { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }

    .btn { padding: 8px 16px; border-radius: 7px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn.login { color: #555; }
    .btn.signup { background: linear-gradient(90deg, #0d47a1, #00b0ff); color: white; border: none; box-shadow: 0 4px 10px rgba(13, 71, 161, 0.2); }

    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #00b0ff; }
    .user-initial-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0d47a1, #42a5f5); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #00b0ff; }
    .logout-btn { background: #f44336; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; }

    /* Main Container & Details Layout */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px 50px; }
    .breadcrumb { font-size: 12px; color: #777; margin-bottom: 15px; }
    .breadcrumb a { color: #0d47a1; text-decoration: none; }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e0e6ed;
    }

    /* Left - Image Gallery */
    .gallery-container { display: flex; flex-direction: column; gap: 12px; }
    .main-img-box {
      width: 100%;
      height: 380px;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .main-img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .thumbnail-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .thumb-img {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.7;
    }
    .thumb-img.active { border-color: #0d47a1; opacity: 1; }

    /* Right - Account Info */
    .info-container { display: flex; flex-direction: column; }
    .status-badge-inline {
      display: inline-block;
      align-self: flex-start;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .acc-title { font-size: 26px; font-weight: 800; color: #111; margin-bottom: 10px; }
    .acc-price { font-size: 28px; font-weight: 800; color: #d32f2f; margin-bottom: 15px; }

    .prime-banner {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    /* Grid Stats Box */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card div:first-child { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .stat-card div:last-child { font-size: 16px; color: #0f172a; font-weight: 800; margin-top: 4px; }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .btn-buy { background: linear-gradient(90deg, #ff5722, #f4511e); color: white; box-shadow: 0 4px 12px rgba(244, 81, 30, 0.3); }
    .btn-whatsapp { background: #25d366; color: white; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    /* Section Header */
    .section-title { font-size: 20px; font-weight: 800; color: #0d47a1; margin: 40px 0 20px; }

    /* Similar Accounts Grid */
    .accounts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    
    @media (max-width: 992px) {
      .product-layout { grid-template-columns: 1fr; }
      .accounts-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .main-img-box { height: 260px; }
      .acc-title { font-size: 20px; }
      .acc-price { font-size: 22px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>

  <!-- Navigation Header -->
  <header class="header">
    <a href="index.html" class="logo">
      <img src="https://i.pinimg.com/736x/51/2d/2f/512d2fa49ba4a8b4f24f50e690d8ded7.jpg" alt="Logo" class="logo-img">
      GAMING M4K STORE
    </a>

    <div class="menu-toggle" id="mobileMenuBtn">
      <i class="fa-solid fa-bars"></i>
    </div>

    <div class="nav-wrapper" id="navWrapper">
      <nav class="nav">
        <a href="index.html">⌂ Home</a>
        <a href="home.html" class="active">🎮 Accounts</a>
        <a href="home.html#sale">🏷 On Sale</a>
      </nav>

      <div class="social-links">
        <a href="#" target="_blank" class="social-icon" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
        <a href="#" target="_blank" class="social-icon" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#" target="_blank" class="social-icon" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" target="_blank" class="social-icon" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      </div>

      <div class="auth-buttons">
        <button class="btn login" id="loginBtn">↪ Login</button>
        <button class="btn signup" id="signUpBtn">✦ Sign Up</button>
        <div class="user-profile" id="userProfile" style="display: none;">
          <div id="avatarContainer"></div>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="breadcrumb">
      <a href="index.html">Home</a> / <a href="home.html">Accounts</a> / <span id="breadAccName">Loading...</span>
    </div>

    <!-- Details Box -->
    <div class="product-layout" id="detailsLayout">
      <!-- Left: Image Gallery -->
      <div class="gallery-container">
        <div class="main-img-box">
          <img id="mainDisplayImg" src="https://via.placeholder.com/600x400?text=Loading+Image..." alt="Account Main Display">
        </div>
        <div class="thumbnail-row" id="thumbnailRow"></div>
      </div>

      <!-- Right: Info Panel -->
      <div class="info-container">
        <span class="status-badge-inline" id="accStatusBadge">Available</span>
        <h1 class="acc-title" id="accNameDisplay">Loading...</h1>
        <div class="acc-price" id="accPriceDisplay">LKR 0</div>

        <div class="prime-banner">
          <span id="accPrimeDisplay">♟ Prime Badge</span>
          <span id="accBadgeDisplay">P7</span>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div>Level</div>
            <div id="accLvDisplay">0</div>
          </div>
          <div class="stat-card">
            <div>Rank</div>
            <div id="accRankDisplay">-</div>
          </div>
          <div class="stat-card">
            <div>Skins</div>
            <div id="accSkinsDisplay">0</div>
          </div>
          <div class="stat-card">
            <div>Bundles</div>
            <div id="accBundlesDisplay">0</div>
          </div>
        </div>

        <a id="buyNowBtn" href="#" target="_blank" class="action-btn btn-buy">
          <i class="fa-solid fa-cart-shopping"></i> Purchase This Account
        </a>
        <a id="whatsappBtn" href="#" target="_blank" class="action-btn btn-whatsapp">
          <i class="fa-brands fa-whatsapp"></i> Ask on WhatsApp
        </a>
      </div>
    </div>

    <!-- Similar Accounts Section -->
    <h2 class="section-title">Similar Accounts</h2>
    <div class="accounts-grid" id="similarGrid"></div>
  </main>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXS_h3y11X4pEvBDhD2KFlOKmAiIrRPXY",
      authDomain: "gaming-m4k.firebaseapp.com",
      projectId: "gaming-m4k",
      storageBucket: "gaming-m4k.firebasestorage.app",
      messagingSenderId: "160833053716",
      appId: "1:160833053716:web:7c2d55a58d27c88294b301"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Responsive Menu Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navWrapper = document.getElementById('navWrapper');

    mobileMenuBtn.addEventListener('click', () => {
      navWrapper.classList.toggle('active');
      const icon = mobileMenuBtn.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-xmark');
    });

    // Auth State Handle
    const loginBtn = document.getElementById('loginBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const userProfile = document.getElementById('userProfile');
    const avatarContainer = document.getElementById('avatarContainer');
    const logoutBtn = document.getElementById('logoutBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = 'none';
        signUpBtn.style.display = 'none';
        userProfile.style.display = 'flex';
        avatarContainer.innerHTML = user.photoURL 
          ? `<img src="${user.photoURL}" class="user-avatar">` 
          : `<div class="user-initial-avatar">${user.email.charAt(0).toUpperCase()}</div>`;
      } else {
        loginBtn.style.display = 'inline-block';
        signUpBtn.style.display = 'inline-block';
        userProfile.style.display = 'none';
      }
    });

    loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    signUpBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Get URL Parameter (Account ID)
    const urlParams = new URLSearchParams(window.location.search);
    const accountId = urlParams.get('id');

    async function loadAccountDetails() {
      if (!accountId) {
        alert("Account ID not found!");
        window.location.href = "home.html";
        return;
      }

      try {
        const docRef = doc(db, "accounts", accountId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();

          // Populate UI Fields
          document.getElementById('breadAccName').innerText = data.name;
          document.getElementById('accNameDisplay').innerText = data.name;
          document.getElementById('accPriceDisplay').innerText = `LKR ${parseInt(data.price).toLocaleString()}`;
          document.getElementById('accStatusBadge').innerText = data.status || 'AVAILABLE';
          document.getElementById('accPrimeDisplay').innerText = `♟ ${data.prime || 'Prime Level'}`;
          document.getElementById('accBadgeDisplay').innerText = data.badge || 'P7';
          document.getElementById('accLvDisplay').innerText = data.lv || 0;
          document.getElementById('accRankDisplay').innerText = data.rank || '-';
          document.getElementById('accSkinsDisplay').innerText = data.skins || 0;
          document.getElementById('accBundlesDisplay').innerText = data.bundles || 0;

          // Main Image Setup
          const mainImg = document.getElementById('mainDisplayImg');
          mainImg.src = data.img || 'https://via.placeholder.com/600x400';

          // Thumbnail List (If multiple images exist or fallback to main image)
          const thumbRow = document.getElementById('thumbnailRow');
          const imagesList = data.images && data.images.length > 0 ? data.images : [data.img];

          thumbRow.innerHTML = "";
          imagesList.forEach((imgUrl, idx) => {
            const thumb = document.createElement('img');
            thumb.src = imgUrl;
            thumb.className = `thumb-img ${idx === 0 ? 'active' : ''}`;
            thumb.onclick = () => {
              mainImg.src = imgUrl;
              document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');
            };
            thumbRow.appendChild(thumb);
          });

          // WhatsApp Action Setup
          const whatsappNumber = "94781234567"; // Change to your actual admin WhatsApp number
          const message = encodeURIComponent(`Hello! I want to buy this account:\n\n*Name:* ${data.name}\n*Price:* LKR ${data.price}\n*ID:* ${accountId}`);
          
          document.getElementById('buyNowBtn').href = `https://wa.me/${whatsappNumber}?text=${message}`;
          document.getElementById('whatsappBtn').href = `https://wa.me/${whatsappNumber}?text=${message}`;

        } else {
          alert("Account not found!");
          window.location.href = "home.html";
        }
      } catch (err) {
        console.error("Error loading account: ", err);
      }
    }

    // Load Similar Accounts
    async function loadSimilarAccounts() {
      const similarGrid = document.getElementById('similarGrid');
      const q = query(collection(db, "accounts"), limit(4));
      const querySnapshot = await getDocs(q);

      similarGrid.innerHTML = "";
      querySnapshot.forEach((docSnap) => {
        if(docSnap.id !== accountId) {
          const data = docSnap.data();
          similarGrid.innerHTML += `
            <div class="card" style="background:white; border:1px solid #eee; border-radius:10px; overflow:hidden;">
              <a href="short.html?id=${docSnap.id}" style="text-decoration:none; color:inherit;">
                <img src="${data.img}" style="width:100%; height:120px; object-fit:cover;">
                <div style="padding:10px;">
                  <div style="font-weight:bold; font-size:13px;">${data.name}</div>
                  <div style="color:#d32f2f; font-weight:800; font-size:12px; margin-top:4px;">LKR ${parseInt(data.price).toLocaleString()}</div>
                </div>
              </a>
            </div>
          `;
        }
      });
    }

    loadAccountDetails();
    loadSimilarAccounts();
  </script>

</body>
