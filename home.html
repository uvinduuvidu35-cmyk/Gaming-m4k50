<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming m4k Store - Browse Accounts</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f7fa; color: #333; }

    /* Header */
    .header { height: 62px; background: #fff; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 800; color: #0d47a1; letter-spacing: 1px; text-decoration: none; }
    .logo-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #64b5f6; }
    .nav { display: flex; align-items: center; gap: 25px; }
    .nav a { text-decoration: none; color: #555; font-size: 14px; padding: 9px 12px; border-radius: 7px; }
    .nav a:hover, .nav a.active { background: #e3f2fd; color: #0d47a1; }
    .auth-buttons { display: flex; align-items: center; gap: 8px; }
    .btn { padding: 9px 16px; border-radius: 7px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 600; }
    .btn.login { color: #555; }
    .btn.signup { background: linear-gradient(90deg, #0d47a1, #00b0ff); color: white; border: none; box-shadow: 0 4px 10px rgba(13, 71, 161, 0.2); }

    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #00b0ff; }
    .user-initial-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0d47a1, #42a5f5); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #00b0ff; }
    .logout-btn { background: #f44336; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; }

    /* Admin Banner */
    .admin-banner { background: #fff3cd; border: 1px solid #ffe8a1; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; color: #856404; font-weight: bold; font-size: 13px; }
    .btn-admin { background: #0d47a1; color: white; padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; border: none; }

    /* Card Controls */
    .card-admin-controls { display: flex; gap: 6px; padding: 10px 13px; border-top: 1px solid #eee; background: #fafafa; position: relative; z-index: 10; }
    .btn-edit, .btn-delete { flex: 1; padding: 7px; border-radius: 6px; font-size: 12px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-edit { background: #ff9800; color: white; }
    .btn-delete { background: #f44336; color: white; }

    .pencil-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; z-index: 10; }

    /* Hero & Filters */
    .hero { text-align: center; padding: 48px 20px 25px; background: #fff; }
    .hero h1 { font-size: 28px; color: #0d47a1; margin-bottom: 8px; }
    .filters { background: #fff; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 12px 5%; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .filter { border: 1px solid #bbdefb; background: #f4f9ff; padding: 8px 14px; border-radius: 18px; font-size: 12px; color: #0d47a1; cursor: pointer; font-weight: 600; }
    .filter.active { background: linear-gradient(90deg, #0d47a1, #00b0ff); color: #fff; border-color: #0d47a1; }
    .price-input { width: 95px; border: 1px solid #ddd; border-radius: 7px; padding: 9px; font-size: 12px; }
    .apply { background: linear-gradient(90deg, #0d47a1, #00b0ff); border: none; color: white; padding: 9px 17px; border-radius: 7px; cursor: pointer; font-weight: bold; }

    /* Main Container & Grid */
    .container { max-width: 1250px; margin: auto; padding: 18px 20px 50px; }
    .result-count { font-size: 14px; margin-bottom: 15px; font-weight: 600; }
    .accounts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 7px rgba(0, 0, 0, 0.06); transition: 0.25s; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .card-image { height: 190px; position: relative; background: #181818; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .status-badge { position: absolute; top: 10px; left: 10px; border-radius: 4px; padding: 5px 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .status-badge.sold { background: #ffe4e4; color: #dc3b3b; }
    .status-badge.available { background: #e8f5e9; color: #2e7d32; }
    .status-badge.onsale { background: #fff8e1; color: #f57f17; }
    .level-badge { position: absolute; right: 9px; bottom: 9px; background: #0d47a1; color: white; border-radius: 5px; padding: 4px 8px; font-size: 10px; }
    .card-content { padding: 13px; }
    .account-name { font-size: 14px; font-weight: bold; margin-bottom: 7px; }
    .prime { display: inline-block; background: #1565c0; color: white; padding: 4px 8px; border-radius: 10px; font-size: 10px; margin-bottom: 10px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; color: #555; font-size: 11px; margin-bottom: 8px; }
    .price { color: #0d47a1; font-weight: 800; font-size: 14px; }

    /* Modal Popup UI */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h3 { font-size: 16px; color: #0d47a1; }
    .close-modal { font-size: 20px; cursor: pointer; color: #888; font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    .btn-submit { width: 100%; padding: 10px; background: #0d47a1; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    @media (max-width: 900px) { .accounts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .accounts-grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <a href="home.html" class="logo">
      <img src="https://i.pinimg.com/736x/51/2d/2f/512d2fa49ba4a8b4f24f50e690d8ded7.jpg" alt="Logo" class="logo-img" loading="lazy">
      GAMING M4K STORE
    </a>
    <nav class="nav">
      <a href="index.html">⌂ Home</a>
      <a href="home.html" class="active">🎮 Accounts</a>
      <a href="#sale">🏷 On Sale</a>
    </nav>
    <div class="auth-buttons">
      <button class="btn login" id="loginBtn">↪ Login</button>
      <button class="btn signup" id="signUpBtn">✦ Sign Up</button>
      <div class="user-profile" id="userProfile" style="display: none;">
        <div id="avatarContainer"></div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <!-- Admin Control Bar -->
  <div class="admin-banner" id="adminBanner" style="display: none;">
    <span>⚡ Admin Panel Active (<span id="adminEmailText"></span>)</span>
    <button class="btn-admin" id="openAddBtn">+ Add New Account</button>
  </div>

  <!-- Hero & Filters -->
  <section class="hero">
    <h1>Browse FF Accounts</h1>
    <p>Explore verified accounts — use filters to find your perfect match</p>
  </section>

  <div class="filters">
    <button class="filter active" data-status="all" onclick="setStatusFilter('all', this)">All</button>
    <button class="filter" data-status="available" onclick="setStatusFilter('available', this)">Available</button>
    <button class="filter" data-status="onsale" onclick="setStatusFilter('onsale', this)">On Sale</button>
    <button class="filter" data-status="sold" onclick="setStatusFilter('sold', this)">Sold</button>
    <input class="price-input" id="minPrice" type="number" placeholder="Min LKR">
    <input class="price-input" id="maxPrice" type="number" placeholder="Max LKR">
    <button class="apply" onclick="filterAccounts()">🔍 Apply</button>
  </div>

  <!-- Accounts Grid -->
  <main class="container">
    <div class="result-count"><span id="countDisplay">Showed accounts</span></div>
    <div class="accounts-grid" id="accountsGrid">
      <!-- Firestore Data -->
    </div>
  </main>

  <!-- Add / Edit Modal Form -->
  <div class="modal" id="accountModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Account</h3>
        <span class="close-modal" id="closeModalBtn">&times;</span>
      </div>
      <form id="accountForm">
        <input type="hidden" id="editCardId">
        <div class="form-group">
          <label>Account Name</label>
          <input type="text" id="accName" required placeholder="e.g. N589">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="accStatus">
            <option value="available">AVAILABLE</option>
            <option value="onsale">ON SALE</option>
            <option value="sold">SOLD</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price (LKR)</label>
          <input type="number" id="accPrice" required placeholder="e.g. 25000">
        </div>
        <!-- මුළුමනින්ම URL එක විතරක් ඇතුළත් කිරීමට පමණක් ලබා දී ඇත -->
        <div class="form-group">
          <label>Account Image URL</label>
          <input type="url" id="accImgUrl" required placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>Prime Tag & Level Badge</label>
          <input type="text" id="accPrime" placeholder="e.g. Prime Level 7 ★" required>
          <input type="text" id="accBadge" placeholder="e.g. P7" style="margin-top:5px;" required>
        </div>
        <div class="form-group">
          <label>Stats (LV | Rank | Skins | Bundles)</label>
          <div style="display:flex; gap:5px;">
            <input type="number" id="accLv" placeholder="LV" required>
            <input type="text" id="accRank" placeholder="Rank" required>
            <input type="number" id="accSkins" placeholder="Skins" required>
            <input type="number" id="accBundles" placeholder="Bundles" required>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="saveBtn">Save Account</button>
      </form>
    </div>
  </div>

  <!-- Firebase Integration & Main Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXS_h3y11X4pEvBDhD2KFlOKmAiIrRPXY",
      authDomain: "gaming-m4k.firebaseapp.com",
      projectId: "gaming-m4k",
      storageBucket: "gaming-m4k.firebasestorage.app",
      messagingSenderId: "160833053716",
      appId: "1:160833053716:web:7c2d55a58d27c88294b301",
      measurementId: "G-T6XT0GWY87"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const EXCLUSIVE_ADMIN_EMAIL = "uvinduuvidu35@gmail.com";

    let isCurrentUserAdmin = false;
    let currentStatus = 'all';

    // UI Elements
    const loginBtn = document.getElementById('loginBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const userProfile = document.getElementById('userProfile');
    const avatarContainer = document.getElementById('avatarContainer');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminBanner = document.getElementById('adminBanner');
    const adminEmailText = document.getElementById('adminEmailText');
    const modal = document.getElementById('accountModal');
    const accountForm = document.getElementById('accountForm');
    const openAddBtn = document.getElementById('openAddBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const accountsGrid = document.getElementById('accountsGrid');

    // Global Filters
    window.setStatusFilter = function(status, element) {
      document.querySelectorAll('.filters .filter[data-status]').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentStatus = status;
      window.filterAccounts();
    };

    window.filterAccounts = function() {
      const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
      const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
      const cards = document.querySelectorAll('.card');
      let visibleCount = 0;

      cards.forEach(card => {
        const cardStatus = card.getAttribute('data-status');
        const cardPrice = parseFloat(card.getAttribute('data-price'));
        const matchStatus = (currentStatus === 'all') || (cardStatus === currentStatus);
        const matchPrice = (cardPrice >= minPrice) && (cardPrice <= maxPrice);

        if (matchStatus && matchPrice) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });
      document.getElementById('countDisplay').innerText = visibleCount + " accounts found";
    };

    // Authentication Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = 'none';
        signUpBtn.style.display = 'none';
        userProfile.style.display = 'flex';

        avatarContainer.innerHTML = user.photoURL 
          ? `<img src="${user.photoURL}" class="user-avatar" title="${user.email}">` 
          : `<div class="user-initial-avatar">${user.email.charAt(0).toUpperCase()}</div>`;

        isCurrentUserAdmin = (user.email.toLowerCase() === EXCLUSIVE_ADMIN_EMAIL.toLowerCase());

        if (isCurrentUserAdmin) {
          adminBanner.style.display = 'flex';
          if(adminEmailText) adminEmailText.innerText = user.email;
        } else {
          adminBanner.style.display = 'none';
        }
      } else {
        isCurrentUserAdmin = false;
        loginBtn.style.display = 'inline-block';
        signUpBtn.style.display = 'inline-block';
        userProfile.style.display = 'none';
        adminBanner.style.display = 'none';
      }
      renderAdminControls();
    });

    loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    signUpBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Admin Panel Controls Hide/Show
    function renderAdminControls() {
      const adminControls = document.querySelectorAll('.card-admin-controls, .pencil-badge');
      adminControls.forEach(el => {
        el.style.display = isCurrentUserAdmin ? 'flex' : 'none';
      });
    }

    // දත්ත ඉක්මනින් ලෝඩ් වීමට පළමු ගිණුම් 20 ට සීමා කර ඇත (Optimization Query)
    const accountsRef = collection(db, "accounts");
    const optimizedQuery = query(accountsRef, orderBy("updatedAt", "desc"), limit(20));

    onSnapshot(optimizedQuery, (snapshot) => {
      accountsGrid.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const cardId = docSnap.id;
        const cardHTML = renderCardHTML(cardId, data);
        accountsGrid.insertAdjacentHTML('beforeend', cardHTML);
      });
      renderAdminControls();
      window.filterAccounts();
    });

    function renderCardHTML(id, data) {
      const imgSource = data.img || 'https://via.placeholder.com/300x190?text=No+Image';
      return `
        <div class="card" id="${id}" 
             data-status="${data.status}" 
             data-price="${data.price}" 
             data-name="${data.name}" 
             data-prime="${data.prime}" 
             data-level="${data.lv}" 
             data-rank="${data.rank}" 
             data-skins="${data.skins}" 
             data-bundles="${data.bundles}" 
             data-img="${imgSource}" 
             data-badge="${data.badge}">
          <div class="card-image">
            <img src="${imgSource}" alt="Account Image" loading="lazy">
            <span class="status-badge ${data.status}">${data.status}</span>
            <span class="level-badge">🔒 ${data.badge}</span>
            <div class="pencil-badge" onclick="editCard('${id}', event)" style="display: ${isCurrentUserAdmin ? 'flex' : 'none'};">
              <i class="fa-solid fa-pencil"></i>
            </div>
          </div>
          <a href="short.html" style="text-decoration: none; color: inherit;">
            <div class="card-content">
              <div class="account-name">${data.name}</div>
              <span class="prime">♟ ${data.prime}</span>
              <div class="stats">
                <span>⌁ LV ${data.lv}</span>
                <span>♙ ${data.rank}</span>
                <span>◉ ${data.skins} Skins</span>
                <span>♧ ${data.bundles} Bundles</span>
              </div>
              <div class="price">LKR ${parseInt(data.price).toLocaleString()}</div>
            </div>
          </a>
          <div class="card-admin-controls" style="display: ${isCurrentUserAdmin ? 'flex' : 'none'};">
            <button class="btn-edit" onclick="editCard('${id}', event)"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            <button class="btn-delete" onclick="deleteCard('${id}', event)"><i class="fa-solid fa-trash-can"></i> Delete</button>
          </div>
        </div>
      `;
    }

    // Delete Card
    window.deleteCard = async function(cardId, e) {
      if (e) e.stopPropagation();
      if (!isCurrentUserAdmin) return alert("❌ Admin Only!");

      if (confirm("ඔබට මෙම ගිණුම Database එකෙන්ම ඉවත් කිරීමට අවශ්‍යද?")) {
        try {
          await deleteDoc(doc(db, "accounts", cardId));
        } catch (err) {
          alert("Error deleting account: " + err.message);
        }
      }
    };

    // Edit Card Data Populate
    window.editCard = function(cardId, e) {
      if (e) e.stopPropagation();
      if (!isCurrentUserAdmin) return alert("❌ Admin Only!");

      const card = document.getElementById(cardId);
      if (!card) return;

      document.getElementById('modalTitle').innerText = "Edit Account";
      document.getElementById('editCardId').value = cardId;

      document.getElementById('accName').value = card.getAttribute('data-name') || '';
      document.getElementById('accStatus').value = card.getAttribute('data-status') || 'available';
      document.getElementById('accPrice').value = card.getAttribute('data-price') || '';
      document.getElementById('accImgUrl').value = card.getAttribute('data-img') || '';
      document.getElementById('accPrime').value = card.getAttribute('data-prime') || '';
      document.getElementById('accBadge').value = card.getAttribute('data-badge') || '';
      document.getElementById('accLv').value = card.getAttribute('data-level') || '';
      document.getElementById('accRank').value = card.getAttribute('data-rank') || '';
      document.getElementById('accSkins').value = card.getAttribute('data-skins') || '';
      document.getElementById('accBundles').value = card.getAttribute('data-bundles') || '';

      modal.style.display = "flex";
    };

    openAddBtn.addEventListener('click', () => {
      if (!isCurrentUserAdmin) return alert("❌ Admin Only!");
      document.getElementById('modalTitle').innerText = "Add New Account";
      document.getElementById('editCardId').value = "";
      accountForm.reset();
      modal.style.display = "flex";
    });

    closeModalBtn.addEventListener('click', () => { modal.style.display = "none"; });
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = "none"; });

    // Save/Update to Firestore
    accountForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isCurrentUserAdmin) return alert("❌ Admin Only!");

      const editId = document.getElementById('editCardId').value;
      const accountData = {
        name: document.getElementById('accName').value,
        status: document.getElementById('accStatus').value,
        price: Number(document.getElementById('accPrice').value),
        img: document.getElementById('accImgUrl').value,
        prime: document.getElementById('accPrime').value,
        badge: document.getElementById('accBadge').value,
        lv: Number(document.getElementById('accLv').value),
        rank: document.getElementById('accRank').value,
        skins: Number(document.getElementById('accSkins').value),
        bundles: Number(document.getElementById('accBundles').value),
        updatedAt: new Date()
      };

      try {
        if (editId) {
          await updateDoc(doc(db, "accounts", editId), accountData);
        } else {
          await addDoc(collection(db, "accounts"), accountData);
        }
        modal.style.display = "none";
        accountForm.reset();
      } catch (err) {
        alert("Error saving data: " + err.message);
      }
    });
  </script>

</body>
</html>
